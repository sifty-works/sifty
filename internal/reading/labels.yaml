# Words code reads conditions by.
# labels: labels of lines ("Salary: …") by the condition the line states.
labels:
  money: [salary, base salary, base pay, cash, cash compensation, compensation, annual salary,
    salary range, pay range, total cash]
  location: [location, locations, work location, hiring location, hiring locations,
    permitted location, permitted locations, permitted hiring location, permitted hiring locations,
    eligible location, eligible locations, eligible hiring locations, location eligibility,
    locations we hire in, location requirements, work eligibility]
  mode: [work mode, workplace, working mode]
  engagement: [employment type, engagement, contract type]
  hours: [hours, working hours, time commitment]
  zone: [timezone, time zone]
# modes: work modes and the words that state them, alone in a value or a location part.
modes:
  remote: [remote, remote only, fully remote, remote-first, remote first, telecommute, telecommuting, telework, teleworking]
  hybrid: [hybrid]
  onsite: [office, on-site, onsite, on site, in office, in-office]
